name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting
          POSTGRES_DB: meeting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meeting"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://meeting:meeting@localhost:5432/meeting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories in any dependency (runtime or dev tooling).
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t meeting-api:${{ github.sha }} .
