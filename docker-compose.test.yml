name: meeting-backend-tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting_test
    ports: ["127.0.0.1:${TEST_DB_PORT:-55432}:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_test"]
      interval: 2s
      retries: 15
  api:
    build: { context: ., target: dev }
    command: ["npm", "test"]
    environment:
      TEST_DATABASE_URL: postgres://meeting:meeting@db:5432/meeting_test
    depends_on:
      db: { condition: service_healthy }
