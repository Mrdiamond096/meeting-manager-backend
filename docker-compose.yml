# Standalone stack: backend + its database (used when this repo is cloned alone)
name: meeting-backend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., target: dev }
    env_file: .env.example
    ports: ["3000:3000"]
    volumes: [./src:/app/src]
    depends_on:
      db: { condition: service_healthy }
volumes:
  db-data:
